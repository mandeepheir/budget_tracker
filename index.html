
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <div class="logo">BT</div>
            <div>
                <h1>Budget Tracker</h1>
                <p>Keep track of your everyday spending.</p>
            </div>
        </header>

        <section class="summary">
            <article class="summary-card">
                <p>Total Spending</p>
                <h2>$<span id="total">0.00</span></h2>
            </article>

            <article class="summary-card">
                <p>Total Expenses</p>
                <h2><span id="count">0</span></h2>
            </article>
        </section>

        <section class="card">
            <h2 id="formTitle">Add an Expense</h2>

            <form id="expenseForm">
                <div class="form-group">
                    <label for="expense">Expense Name</label>
                    <input
                        type="text"
                        id="expense"
                        placeholder="e.g. Groceries"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="e.g. 25.50"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select a category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="expenseDate">Expense Date</label>
                    <input type="date" id="expenseDate" required>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitBtn" class="primary-btn">
                        Add Expense
                    </button>

                    <button
                        type="button"
                        id="cancelEditBtn"
                        class="secondary-btn"
                        hidden
                    >
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <section class="card">
            <div class="list-header">
                <div>
                    <h2>Your Expenses</h2>
                    <p class="section-description">Review and manage your spending.</p>
                </div>

                <div class="filter-group">
                    <label for="filterCategory">Filter</label>
                    <select id="filterCategory">
                        <option value="All">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <ul id="expenseList" class="expense-list"></ul>

            <p id="emptyMessage" class="empty-message">
                No expenses yet. Add your first expense above.
            </p>
        </section>

        <footer>
            <p>Your budget, your control.</p>
        </footer>
    </main>
</body>
</html>
